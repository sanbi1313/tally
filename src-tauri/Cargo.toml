[package]
name = "tally"
version = "0.1.0"
description = "작업용 타이머"
edition = "2021"

[lib]
name = "tally_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
png = "0.18.1"
base64 = "0.23.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.4"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "vorbis"] }
tauri-plugin-autostart = "2.7.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
